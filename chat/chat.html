<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'">
<title>Chat</title>
<link rel="stylesheet" href="chat.css">
</head>
<body>
<svg hidden>
  <symbol id="i-gear" viewBox="0 0 16 16"><path d="m6.3 2-.4 1.6-1 .6-1.6-.4-1.4 2.4 1.2 1.2v1.2L1.9 9.8l1.4 2.4 1.6-.4 1 .6.4 1.6h2.8l.4-1.6 1-.6 1.6.4 1.4-2.4-1.2-1.2V7.4l1.2-1.2-1.4-2.4-1.6.4-1-.6L9.1 2z"/><circle cx="7.7" cy="8" r="2"/></symbol>
  <symbol id="i-send" viewBox="0 0 16 16"><path d="M12.5 3.5v4.5a2 2 0 0 1-2 2h-7m2.5-2.5L3.5 10 6 12.5"/></symbol>
  <symbol id="i-stop" viewBox="0 0 16 16"><rect x="4.5" y="4.5" width="7" height="7" rx="1.2"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><path d="m3.5 8.5 3 3 6-7"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="m5 5 6 6m0-6-6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 16 16"><path d="m5 6.5 3 3 3-3"/></symbol>
  <symbol id="i-right" viewBox="0 0 16 16"><path d="m6.5 5 3 3-3 3"/></symbol>
  <symbol id="i-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5M8 11h.01"/></symbol>
</svg>

<header id="chat-head">
  <span id="chat-status" role="img" data-status="setup" aria-label="Not connected" title="Not connected"></span>
  <h1 id="chat-name">Agent</h1>
  <button id="chat-agents" class="icon-btn" type="button" aria-label="Agent settings" title="Agent settings"><svg class="icon" aria-hidden="true"><use href="#i-gear"/></svg></button>
</header>

<main id="chat-main">
  <div id="chat-empty">
    <p id="chat-empty-name">Agent</p>
    <p id="chat-empty-note"></p>
  </div>
  <section id="chat-connect-card" aria-labelledby="chat-connect-text" hidden>
    <p id="chat-pending" class="ai-bubble" hidden></p>
    <div class="card">
      <p id="chat-connect-text">Skiff talks to the AI agent you already use. Connect one in Settings and this question goes to it.</p>
      <button id="chat-connect" class="text-btn primary" type="button">Connect an agent</button>
    </div>
  </section>
  <div id="chat-log" role="log" aria-label="Conversation" tabindex="-1" hidden></div>
</main>

<div id="chat-foot">
  <p id="chat-error" role="alert" hidden></p>
  <section id="chat-permission" aria-labelledby="chat-permission-title" hidden>
    <div class="card">
      <p class="ask">Permission request</p>
      <p id="chat-permission-title"></p>
      <div id="chat-permission-options"></div>
    </div>
  </section>
  <form id="chat-composer">
    <textarea id="chat-input" rows="1" aria-label="Message" placeholder="Ask for a follow-up" spellcheck="true"></textarea>
    <div id="chat-tools">
      <label class="pill" hidden><select id="chat-model" aria-label="Model"></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></label>
      <label class="pill" hidden><select id="chat-effort" aria-label="Effort"></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></label>
      <button id="chat-stop" class="square-btn" type="button" aria-label="Stop" title="Stop" hidden><svg class="icon" aria-hidden="true"><use href="#i-stop"/></svg></button>
      <button id="chat-send" class="square-btn" type="submit" aria-label="Send" title="Send (Enter)"><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg></button>
    </div>
  </form>
</div>

<script src="chat.js"></script>
</body>
</html>
