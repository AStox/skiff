<!doctype html>
<html lang="en" class="buoy">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
<title>Buoy</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<svg hidden>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
</svg>

<div id="buoy" role="group" aria-label="Skiff">
  <button id="buoy-main" type="button" aria-haspopup="dialog" aria-expanded="false" title="Show or hide the panel. Drag to move"><span class="space-dot" aria-hidden="true"></span><span id="buoy-name"></span><span id="buoy-notice" hidden></span><span id="buoy-agents" class="count" hidden></span></button>
  <span id="buoy-favs" role="group" aria-label="Favorites" hidden></span>
  <span class="buoy-sep" aria-hidden="true"></span>
  <button id="buoy-tabs" class="buoy-ic count" type="button" aria-haspopup="dialog" aria-expanded="false"></button>
  <button id="buoy-new" class="buoy-ic" type="button" aria-label="New tab" title="New tab"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
</div>

<script src="common.js"></script>
<script src="buoy.js"></script>
</body>
</html>
