<!doctype html>
<html lang="en" class="buoy">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
<title>Buoy</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<svg hidden>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-forward" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-reload" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-archive" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.63l4.36-1.32a2 2 0 0 0 .83-.5z"/><path d="m15 5 4 4"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20"/></symbol>
  <symbol id="i-incognito" viewBox="0 0 24 24"><path d="M3 12h18M6.75 12l1.5-6.75h7.5L17.25 12M10.2 17.25h3.6"/><circle cx="7.5" cy="17.25" r="2.7"/><circle cx="16.5" cy="17.25" r="2.7"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M9.9 5.7A9.7 9.7 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.6 3.4M6.3 7.3C3.9 8.9 2.5 12 2.5 12S6 18.5 12 18.5a9 9 0 0 0 4.4-1.1M3 3l18 18"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 2.25c.6 4.95 2.85 7.65 8.25 9.75-5.4 2.1-7.65 4.8-8.25 9.75-.6-4.95-2.85-7.65-8.25-9.75C9.15 9.9 11.4 7.2 12 2.25z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6a1.4 1.4 0 0 1-1 .4H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/><path d="M16 9a5 5 0 0 1 0 6M19.4 18.4a9 9 0 0 0 0-12.8"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5M9 10.8V4h6v6.8l3 3.2v2H6v-2z"/></symbol>
</svg>

<div id="buoy" role="group" aria-label="Skiff">
  <div id="buoy-row">
    <button id="buoy-main" type="button" aria-haspopup="dialog" aria-expanded="false" title="Open the command bar. Drag to move"><span class="space-dot" aria-hidden="true"></span><span id="buoy-name"></span><span id="buoy-unread" hidden></span><span id="buoy-notice" hidden></span></button>
    <button id="buoy-agents" class="count" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="buoy-agents-list" hidden></button>
    <span id="buoy-favs" role="group" aria-label="Favorites" hidden></span>
    <span class="buoy-sep" aria-hidden="true"></span>
    <button id="buoy-tabs" class="buoy-ic count" type="button" aria-haspopup="dialog" aria-expanded="false"></button>
    <button id="buoy-new" class="buoy-ic" type="button" aria-label="New tab" title="New tab"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
    <button id="update-pill" class="update-pill" type="button" hidden>Update</button>
  </div>
  <span id="buoy-dot" class="space-dot" aria-hidden="true"></span>
  <span id="buoy-unseen" aria-hidden="true" hidden></span>
  <div id="card" role="dialog" aria-label="Command bar">
    <div class="palette-field">
      <span class="space-dot" aria-hidden="true"></span>
      <span id="palette-site" hidden></span>
      <span id="palette-ask" hidden></span>
      <input id="palette-input" type="text" role="combobox" aria-label="Search or enter address" placeholder="Search or enter address" spellcheck="false" autocomplete="off" autocapitalize="off" aria-autocomplete="both" aria-expanded="false" aria-controls="palette-results">
      <span class="palette-nav">
        <button id="back" class="icon-btn" aria-label="Back" title="Back"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
        <button id="forward" class="icon-btn" aria-label="Forward" title="Forward"><svg class="icon" aria-hidden="true"><use href="#i-forward"/></svg></button>
        <button id="reload" class="icon-btn" aria-label="Reload" title="Reload"><svg class="icon" aria-hidden="true"><use href="#i-reload"/></svg></button>
      </span>
    </div>
    <div id="palette-tools" hidden>
      <label class="palette-pill"><select id="palette-agent" aria-label="Agent"></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></label>
      <label class="palette-pill"><select id="palette-model" aria-label="Model"></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></label>
      <label class="palette-pill"><select id="palette-effort" aria-label="Effort"></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></label>
      <label class="palette-check" hidden><input type="checkbox" id="palette-include">Include this page</label>
    </div>
    <p id="palette-error" role="alert" hidden></p>
    <div id="palette-hair" aria-hidden="true"></div>
    <ul id="palette-results" role="listbox" aria-label="Results" hidden></ul>
    <div id="sidebar">
      <div id="favorites" aria-label="Favorites"></div>
      <div id="chips" role="group" aria-label="Filter tabs"></div>
      <div id="space-head"></div>
      <ul id="list" aria-label="Tabs"></ul>
      <section id="panel" aria-label="Settings" hidden></section>
      <section id="confirm-box" role="alertdialog" aria-modal="false" aria-labelledby="confirm-title" aria-describedby="confirm-description" hidden>
        <h2 id="confirm-title"></h2>
        <p id="confirm-description"></p>
        <div class="confirm-actions">
          <button id="confirm-cancel" class="text-btn" type="button">Cancel</button>
          <button id="confirm-accept" class="text-btn danger" type="button">Confirm</button>
        </div>
      </section>
      <div id="shell-error" role="alert" hidden>
        <p id="shell-error-message"></p>
        <button id="shell-error-dismiss" class="text-btn" type="button">Dismiss</button>
      </div>
      <span id="space-status" class="sr-only" role="status"></span>

      <footer>
        <p id="drag-caption" aria-hidden="true" hidden></p>
        <div class="space-strip">
          <div id="dots" role="toolbar" aria-label="Spaces" aria-describedby="space-help"></div>
          <button id="add-space" class="icon-btn" aria-label="New space" title="New space"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
        </div>
        <div class="sidebar-tools">
          <button id="archive-toggle" class="text-btn" aria-label="Archive" title="Archive" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-archive"/></svg>Archive<span id="archive-count" class="count" aria-hidden="true"></span></button>
          <button id="settings-toggle" class="icon-btn" aria-label="Settings" title="Settings" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg></button>
        </div>
        <span id="space-help" class="sr-only">Drag to reorder. Use arrow keys to focus spaces and Alt Shift arrow keys to move a space.</span>
      </footer>
    </div>

    <dialog id="arc-import" aria-labelledby="arc-title" aria-describedby="arc-description">
      <form id="arc-form">
        <header class="import-header">
          <h2 id="arc-title" tabindex="-1">Import from Arc</h2>
          <p id="arc-description">Bring your Arc profiles into Skiff.</p>
          <ol id="arc-steps" aria-label="Import progress">
            <li data-step="profile">Profiles</li>
            <li data-step="categories">Items</li>
            <li data-step="review">Review</li>
          </ol>
        </header>
        <div id="arc-content"></div>
        <footer class="import-footer">
          <p id="arc-status" class="import-note" role="status"></p>
          <p id="arc-error" class="import-note" role="alert"></p>
          <div class="import-actions">
            <button id="arc-cancel" type="button" class="text-btn">Cancel</button>
            <button id="arc-back" type="button" class="text-btn" hidden>Back</button>
            <button id="arc-next" type="submit" class="text-btn import-primary">Continue</button>
          </div>
        </footer>
      </form>
    </dialog>
  </div>
</div>

<ul id="buoy-agents-list" aria-label="Agent tabs" hidden></ul>

<script src="common.js"></script>
<script src="buoy.js"></script>
<script src="palette.js"></script>
<script src="shell.js"></script>
</body>
</html>
