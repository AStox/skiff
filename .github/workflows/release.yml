name: release
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'docs/**', '**.md', '.claude/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - id: bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          version=$(npm version prerelease --preid alpha --no-git-tag-version | sed 's/^v//')
          git commit -am "Release $version"
          git tag "v$version"
          # A newer push to main is queued behind this run and releases it instead.
          if git push --atomic origin HEAD:main "v$version"; then echo "tag=v$version" >> "$GITHUB_OUTPUT"; fi
      # electron-builder creates one draft per parallel upload when none exists yet.
      - if: steps.bump.outputs.tag
        run: gh release create "$TAG" --draft --title "$TAG" --notes ""
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.bump.outputs.tag
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Installed apps read every pushed tag, so a tag left as a draft breaks their update checks.
      - if: steps.bump.outputs.tag
        run: gh release edit "$TAG" --draft=false --prerelease
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
