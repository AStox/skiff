<!doctype html>
<html lang="en" class="overlay">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
<title>Command bar</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<svg hidden>
  <symbol id="i-globe" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M2.5 8h11M8 2.5C6.3 4 5.5 5.8 5.5 8s.8 4 2.5 5.5c1.7-1.5 2.5-3.3 2.5-5.5S9.7 4 8 2.5z"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.2"/><path d="m10.2 10.2 3.3 3.3"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 16 16"><path d="M8 1.5c.4 3.3 1.9 5.1 5.5 6.5-3.6 1.4-5.1 3.2-5.5 6.5-.4-3.3-1.9-5.1-5.5-6.5C6.1 6.6 7.6 4.8 8 1.5z"/></symbol>
  <symbol id="i-down" viewBox="0 0 16 16"><path d="m5 6.5 3 3 3-3"/></symbol>
</svg>

<div id="backdrop"></div>
<div id="palette" role="dialog" aria-label="Command bar">
  <div class="palette-field">
    <span id="palette-site" hidden></span>
    <span id="palette-ask" hidden></span>
    <input id="palette-input" type="text" role="combobox" aria-label="Search or enter address" placeholder="Search or enter address" spellcheck="false" autocomplete="off" autocapitalize="off" aria-autocomplete="both" aria-expanded="false" aria-controls="palette-results">
  </div>
  <div id="palette-tools" hidden>
    <label class="palette-pill"><select id="palette-agent" aria-label="Agent"></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></label>
    <label class="palette-pill"><select id="palette-model" aria-label="Model"></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></label>
    <label class="palette-pill"><select id="palette-effort" aria-label="Effort"></select><svg class="icon" aria-hidden="true"><use href="#i-down"/></svg></label>
    <label class="palette-check" hidden><input type="checkbox" id="palette-include">Include this page</label>
  </div>
  <p id="palette-error" role="alert" hidden></p>
  <ul id="palette-results" role="listbox" aria-label="Results"></ul>
</div>

<script src="common.js"></script>
<script src="palette.js"></script>
</body>
</html>
