<!doctype html>
<html lang="en">
<head>
<title>Fullscreen fixture</title>
<style>
  body { margin: 0; background: #223; color: #fff; font: 18px system-ui }
  #stage { width: 400px; height: 240px; background: #357 }
  video { width: 100%; height: 100% }
  button { margin: 12px }
</style>
</head>
<body>
<div id="stage"><video id="video" muted loop></video></div>
<button id="enter">Fullscreen</button>
<button id="exit">Exit</button>
<script>
  // A canvas stream gives the <video> real frames to play with no media file.
  const canvas = document.createElement('canvas')
  canvas.width = 320
  canvas.height = 180
  const g = canvas.getContext('2d')
  let n = 0
  setInterval(() => { g.fillStyle = `hsl(${n++ * 7 % 360} 70% 50%)`; g.fillRect(0, 0, 320, 180) }, 50)
  const video = document.getElementById('video')
  video.srcObject = canvas.captureStream(20)
  window.events = []
  document.addEventListener('fullscreenchange', () => window.events.push(document.fullscreenElement ? 'enter' : 'leave'))
  document.getElementById('enter').onclick = () => document.getElementById(location.hash === '#stage' ? 'stage' : 'video').requestFullscreen()
  document.getElementById('exit').onclick = () => document.exitFullscreen()
</script>
</body>
</html>
